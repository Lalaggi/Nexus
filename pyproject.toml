[project]
name = "nexus"
version = "0.1.0"
description = "A self-hosted, tool-using AI nexus"
readme = "README.md"
authors = [
    { name = "Ellie Wells", email = "elilovescomputers@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.20.0",
    "cryptography>=43.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pillow>=13.0.0",
    "pydantic-settings>=2.6.0",
    "pypdf>=5.0.0",
    "pypdfium2>=5.15.2",
    "python-multipart>=0.0.12",
    "trafilatura>=2.0.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
nexus = "nexus.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
